name: Self-host Docker

on:
  pull_request:
    branches: [master]
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  smoke:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install & start stack
        run: ./scripts/install.sh --profile=FNB --port=8080

      - name: Smoke test
        run: ./scripts/smoke-test.sh http://localhost:8080

      - name: Dump docker logs
        if: failure()
        run: docker compose logs --no-color > /tmp/docker-logs-smoke.txt 2>&1

      - name: Upload docker logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs-smoke
          path: /tmp/docker-logs-smoke.txt
          retention-days: 7

      - name: Teardown
        if: always()
        run: docker compose down -v

  e2e:
    name: E2E Playwright on Docker stack
    needs: smoke
    runs-on: ubuntu-latest
    # Tạm thời cho phép fail — spec có thể phụ thuộc dữ liệu/cổng không có trong Docker stack
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install & start stack
        run: ./scripts/install.sh --profile=FNB --port=8080

      - name: Seed demo data
        run: docker compose exec -T api sh -c "cd apps/api && npx tsx prisma/seed.ts"

      - name: Install Playwright dependencies
        working-directory: apps/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright tests (docker config)
        working-directory: apps/e2e
        run: npx playwright test --config=playwright.docker.config.ts

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/test-results/
          retention-days: 7

      - name: Dump docker logs
        if: failure()
        run: docker compose logs --no-color > /tmp/docker-logs-e2e.txt 2>&1

      - name: Upload docker logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs-e2e
          path: /tmp/docker-logs-e2e.txt
          retention-days: 7

      - name: Teardown
        if: always()
        run: docker compose down -v
