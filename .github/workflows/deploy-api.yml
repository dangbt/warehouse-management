name: Deploy API

on:
  push:
    branches: [master]
    paths:
      - apps/api/**
      - packages/**
      - .github/workflows/deploy-api.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Secrets deploy prod đang nằm ở environment tên 'development' (tên cũ, giữ để không phải tạo lại secret)
    environment: development

    steps:
      - name: Trigger Render Deploy
        run: curl -s "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
